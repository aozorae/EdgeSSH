name: PR 11 final validation
on:
  push:
    branches: [fix/pr11-editor-review]
    paths: [scripts/pr11-read-cleanup.patch]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply final read cleanup and remove temporary harness
        run: |
          git apply --check scripts/pr11-read-cleanup.patch
          git apply scripts/pr11-read-cleanup.patch
          rm scripts/pr11-read-cleanup.patch .github/workflows/pr11-final-validation.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, all unit tests and Worker dry run
        run: npm run check 2>&1 | tee /tmp/pr11-check.log
      - name: Build frontend and manifest
        run: npm run build:web -- --manifest 2>&1 | tee /tmp/pr11-build.log
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: All desktop and mobile browser regressions
        run: npx playwright test --workers=4 2>&1 | tee /tmp/pr11-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr11-final-validation
          path: |
            /tmp/pr11-*.log
            dist/.vite/manifest.json
            test-results/
          retention-days: 3
      - name: Commit validated final tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(files): release failed text streams and cover reopen regression'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/fix/pr11-editor-review
          git log -1 --format='%H %T %s'
