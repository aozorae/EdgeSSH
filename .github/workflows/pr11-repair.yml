name: PR 11 repair validation

on:
  push:
    branches: [fix/pr11-editor-review]
    paths:
      - .github/workflows/pr11-repair.yml
      - scripts/pr11-repair.patch.b64

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: contains(github.event.head_commit.message, 'repair payload')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed repairs
        shell: bash
        run: |
          python3 -c "import base64,gzip,pathlib; pathlib.Path('/tmp/pr11.patch').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('scripts/pr11-repair.patch.b64').read_text())))"
          sha256sum /tmp/pr11.patch
          git apply --check /tmp/pr11.patch
          git apply /tmp/pr11.patch
          rm scripts/pr11-repair.patch.b64 .github/workflows/pr11-repair.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, unit tests and Worker dry run
        run: npm run check 2>&1 | tee /tmp/pr11-check.log
      - name: Build split frontend bundles
        run: npm run build:web -- --manifest 2>&1 | tee /tmp/pr11-build.log
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npx playwright test --workers=2 2>&1 | tee /tmp/pr11-browser.log
      - name: Export validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr11-validation
          path: |
            /tmp/pr11-*.log
            dist/.vite/manifest.json
            test-results/
          retention-days: 3
      - name: Commit tested repairs to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(files): bound editor work and save traffic; await session shutdown'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/fix/pr11-editor-review
          git log -1 --format='%H %s'
          git show --stat --oneline HEAD
